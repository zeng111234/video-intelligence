[server]
maxUploadSize = 50

[client]
toolbarMode = "minimal"

[theme]
base = "light"
primaryColor = "#2563EB"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#FAFAFA"
codeBackgroundColor = "#F4F4F5"
textColor = "#09090B"
linkColor = "#2563EB"
borderColor = "#E4E4E7"
showWidgetBorder = true
showSidebarBorder = true
baseRadius = "8px"
buttonRadius = "8px"
font = "sans-serif"
baseFontSize = 15
headingFontSizes = ["34px", "28px", "22px", "18px", "16px", "14px"]
headingFontWeights = [600, 600, 600, 600, 600, 600]
linkUnderline = false
chartCategoricalColors = ["#2563EB", "#71717A", "#A1A1AA", "#F59E0B", "#EF4444", "#22C55E", "#8B5CF6"]
grayColor = "#71717A"
blueColor = "#2563EB"
greenColor = "#16A34A"
redColor = "#DC2626"
yellowColor = "#CA8A04"
orangeColor = "#EA580C"
violetColor = "#7C3AED"
dataframeBorderColor = "#E4E4E7"
dataframeHeaderBackgroundColor = "#FAFAFA"

[theme.sidebar]
backgroundColor = "#FAFAFA"
secondaryBackgroundColor = "#F4F4F5"
textColor = "#09090B"
borderColor = "#E4E4E7"
primaryColor = "#2563EB"
