name: videoinsight-control-plane

x-default-logging: &default-logging
  driver: json-file
  options:
    max-size: "${CONTAINER_LOG_MAX_SIZE:-10m}"
    max-file: "${CONTAINER_LOG_MAX_FILES:-3}"

services:
  init-runtime:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    user: "0:0"
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        mkdir -p /app/runtime/data /app/backups &&
        chown -R 10001:10001 /app/runtime/data /app/backups &&
        chmod 700 /app/runtime/data /app/backups
    volumes:
      - ./data:/app/runtime/data
      - ./backups:/app/backups
    healthcheck:
      disable: true
    cpus: "0.25"
    mem_limit: "256m"
    pids_limit: 64
    logging: *default-logging
    restart: "no"

  control-plane:
    build:
      context: ../..
      dockerfile: deploy/control-plane/Dockerfile
    env_file:
      - ${CONTROL_PLANE_ENV_FILE:-.env}
    environment:
      VIDEOINSIGHT_RUNTIME_ROOT: /app/runtime
      AUTH_SESSION_DATABASE_PATH: /app/runtime/data/video_intelligence.db
    expose:
      - "8080"
    volumes:
      - ./data:/app/runtime/data
      - ./backups:/app/backups
    depends_on:
      init-runtime:
        condition: service_completed_successfully
    cpus: "${CONTROL_PLANE_CPU_LIMIT:-1.0}"
    mem_limit: "${CONTROL_PLANE_MEMORY_LIMIT:-1024m}"
    pids_limit: 128
    logging: *default-logging
    restart: unless-stopped
    networks:
      - private

  caddy:
    image: caddy:2.11.4-alpine
    depends_on:
      control-plane:
        condition: service_healthy
    env_file:
      - ${CONTROL_PLANE_ENV_FILE:-.env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./caddy-data:/data
      - ./caddy-config:/config
      - ./updates:/srv/updates:ro
    cpus: "${CADDY_CPU_LIMIT:-0.25}"
    mem_limit: "${CADDY_MEMORY_LIMIT:-256m}"
    pids_limit: 64
    logging: *default-logging
    restart: unless-stopped
    networks:
      - private

networks:
  private:
    driver: bridge
